# Blueprint de Render para dunk labs.
# Crea un Web Service para la API y un Static Site para el frontend.
#
# Si Render cambia los nombres porque ya están ocupados, actualiza:
#   - FRONTEND_URL del backend
#   - VITE_API_URL del frontend

services:
  - type: web
    name: dunklabs-api-jc
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: dunklabs
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://dunklabs-web-jc.onrender.com

  - type: web
    name: dunklabs-web-jc
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://dunklabs-api-jc.onrender.com
    routes:
      - type: rewrite
        source: /catalogo
        destination: /catalogo.html
      - type: rewrite
        source: /cuenta
        destination: /cuenta.html
      - type: rewrite
        source: /admin
        destination: /admin/index.html
      - type: rewrite
        source: /admin/
        destination: /admin/index.html
      - type: rewrite
        source: /admin/*
        destination: /admin/index.html
      - type: rewrite
        source: /*
        destination: /index.html
